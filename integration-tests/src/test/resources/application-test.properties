# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase/jobstore-db-changelog.xml

# Job Executor Configuration - Faster polling for tests
job.executor.poll-interval=1000
job.executor.core-pool-size=2
job.executor.max-pool-size=5
job.executor.queue-capacity=50
job.executor.thread-name-prefix=test-executor-
job.executor.wait-for-tasks-on-shutdown=true
job.executor.await-termination-seconds=10
job.executor.batch-size=10
job.executor.enabled=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.taskmanager=DEBUG
logging.level.liquibase=INFO
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

